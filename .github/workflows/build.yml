name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: md-lite-windows
          path: target/release/md-lite.exe

  linux:
    # Compilé sur une Ubuntu ancienne pour fonctionner sur les distributions plus récentes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo build --release --locked
      - name: Test the app on a virtual screen
        run: |
          sudo apt-get install -y xvfb imagemagick xdotool desktop-file-utils xdg-utils dbus
          ci/run-linux.sh target/release/md-lite screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: md-lite-linux-screenshots
          path: screenshots
      - name: Package
        run: |
          mkdir -p dist/md-lite
          cp target/release/md-lite README.md LICENSE dist/md-lite/
          tar -C dist -czf md-lite-linux-x86_64.tar.gz md-lite
      - uses: actions/upload-artifact@v7
        with:
          name: md-lite-linux
          path: md-lite-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MD Lite ${GITHUB_REF_NAME#v}" --generate-notes
          fi
