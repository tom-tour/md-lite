<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD Lite</title>
<style>
:root{
  --bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--panel:#f6f8fa;--accent:#0969da;--code:#eff1f3;--hover:#e3e7eb;--mark:#fff3a3;--note:#ddf4ff;
  --hl-kw:#cf222e;--hl-str:#0a3069;--hl-num:#0550ae;--hl-com:#6e7781;--hl-fn:#8250df;--hl-type:#953800;--hl-attr:#0550ae;--hl-tag:#116329;--hl-var:#953800;--hl-meta:#8250df;--hl-ins:#e6ffec;--hl-del:#ffebe9;
  --ed-size:14px;--pv-size:16px;--read-width:820px;
}
:root[data-theme=dark]{
  --bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--panel:#161b22;--accent:#4493f8;--code:#1f242c;--hover:#262c36;--mark:#5c4d00;--note:#0c2d6b;
  --hl-kw:#ff7b72;--hl-str:#a5d6ff;--hl-num:#79c0ff;--hl-com:#8b949e;--hl-fn:#d2a8ff;--hl-type:#ffa657;--hl-attr:#79c0ff;--hl-tag:#7ee787;--hl-var:#ffa657;--hl-meta:#d2a8ff;--hl-ins:#12261e;--hl-del:#25171c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--panel:#161b22;--accent:#4493f8;--code:#1f242c;--hover:#262c36;--mark:#5c4d00;--note:#0c2d6b;
  --hl-kw:#ff7b72;--hl-str:#a5d6ff;--hl-num:#79c0ff;--hl-com:#8b949e;--hl-fn:#d2a8ff;--hl-type:#ffa657;--hl-attr:#79c0ff;--hl-tag:#7ee787;--hl-var:#ffa657;--hl-meta:#d2a8ff;--hl-ins:#12261e;--hl-del:#25171c;
}}
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border:0;padding:0;margin:0}
button,select{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 8px;min-width:30px;height:30px;cursor:pointer}
button:hover,select:hover{background:var(--hover)}
button.on{background:var(--bg);border-color:var(--line)}
select{background:var(--panel)}
.spacer{flex:1}
#tabbar{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);min-height:34px}
#tabs{display:flex;overflow-x:auto;scrollbar-width:thin;min-width:0}
.tab{display:flex;align-items:center;gap:2px;padding:0 4px 0 12px;border-right:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;max-width:240px;font-size:13px;user-select:none}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--accent)}
.tab .tname{overflow:hidden;text-overflow:ellipsis}
.tab .tclose{min-width:0;width:22px;height:22px;padding:0;border-radius:4px;font-size:15px;line-height:1;color:var(--muted)}
.tab.dirty .tclose::before{content:"●";font-size:11px}
.tab.dirty .tclose span{display:none}
.tab.dirty .tclose:hover::before{content:none}
.tab.dirty .tclose:hover span{display:inline}
#addtab{height:auto;border-radius:0;font-size:18px;color:var(--muted)}
#tabfill{flex:1}
#banner{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;background:var(--note);border-bottom:1px solid var(--line);font-size:13px}
#banner button{height:26px;border-color:var(--line);background:var(--bg)}
#find{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#find input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:220px}
#fcount{color:var(--muted);font-size:12px;min-width:9ch;padding:0 4px}
body.read .repl{display:none}
main{flex:1;display:flex;min-height:0}
.src,#view{flex:1;min-width:0;overflow:auto}
.src{resize:none;border:0;outline:0;margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font:var(--ed-size)/1.6 ui-monospace,Consolas,"Cascadia Mono",monospace;tab-size:4}
#view{padding:16px 32px;border-left:1px solid var(--line)}
body.edit #view,body.read .src,body.read .fmt{display:none}
body.read #view{border:0}
body.read .md{max-width:var(--read-width);margin:0 auto}
footer.status{display:flex;gap:12px;align-items:center;padding:2px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel)}
footer.status>*{white-space:nowrap;flex-shrink:0}
footer.status button{height:auto;min-width:0;padding:0 4px;font-size:12px;color:var(--muted)}
footer.status #path{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1;direction:rtl;text-align:left}
footer.status .spacer{flex-shrink:1}
#tpick{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#tgrid{display:grid;grid-template-columns:repeat(10,16px);gap:3px}
#tgrid i{display:block;width:16px;height:16px;border:1px solid var(--line);border-radius:2px;background:var(--bg);cursor:pointer}
#tgrid i.on{background:var(--accent);border-color:var(--accent)}
#tlabel{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
/* Paramètres */
#settings{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 8px 32px rgba(0,0,0,.35);overflow:hidden}
#settings[open]{display:flex;flex-direction:column}
#settings::backdrop{background:rgba(0,0,0,.35)}
#settings .body{padding:16px 20px;overflow:auto;flex:1;min-height:0}
#settings h2{margin:0;padding:14px 20px;font-size:17px;border-bottom:1px solid var(--line)}
#settings h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
#settings .body>h3:first-child{margin-top:0}
#settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0}
#settings label.chk{justify-content:flex-start}
#settings select,#settings input[type=number]{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px;height:30px}
#settings input[type=number]{width:72px}
#settings input[type=checkbox]{width:16px;height:16px;margin:0}
#settings .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#settings .bar{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--panel)}
#settings .bar button,#settings .row button{border-color:var(--line);background:var(--bg)}
#defstate{color:var(--muted);font-size:13px}
/* Rendu */
.md{font-size:var(--pv-size);line-height:1.6;overflow-wrap:break-word}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:1.4em 0 .6em;line-height:1.25;font-weight:600}
.md h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
.md h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
.md h3{font-size:1.25em}.md h4{font-size:1em}.md h5{font-size:.875em}.md h6{font-size:.85em;color:var(--muted)}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table,.md details{margin:0 0 1em}
.md ul,.md ol{padding-left:2em}
.md li>ul,.md li>ol{margin:0}
.md li+li{margin-top:.25em}
.md li.task{list-style:none}
.md li.task>input{margin:0 .45em 0 -1.5em;vertical-align:middle;cursor:pointer}
.md blockquote{margin-left:0;padding:0 1em;color:var(--muted);border-left:.25em solid var(--line)}
.md code{font:.875em ui-monospace,Consolas,monospace;background:var(--code);padding:.2em .4em;border-radius:6px}
.md pre{background:var(--code);padding:14px 16px;border-radius:6px;overflow:auto;line-height:1.45}
.md pre code{background:none;padding:0}
.md kbd{font:.8em ui-monospace,Consolas,monospace;padding:.15em .4em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel)}
.md table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 13px}
.md th{background:var(--panel);font-weight:600}
.md hr{border:0;height:.25em;background:var(--line);margin:1.5em 0}
.md a{color:var(--accent)}
.md img,.md video{max-width:100%}
.md mark{background:var(--mark);color:inherit}
.md summary{cursor:pointer}
.md sup.fnref a{text-decoration:none;padding:0 .1em}
.md section.footnotes{margin-top:2em;padding-top:.6em;border-top:1px solid var(--line);font-size:.875em;color:var(--muted)}
.md section.footnotes p{margin:0 0 .4em}
.md a.fnback{text-decoration:none}
.hl-kw{color:var(--hl-kw)}.hl-str{color:var(--hl-str)}.hl-num{color:var(--hl-num)}.hl-com{color:var(--hl-com);font-style:italic}
.hl-fn{color:var(--hl-fn)}.hl-type{color:var(--hl-type)}.hl-attr{color:var(--hl-attr)}.hl-tag{color:var(--hl-tag)}
.hl-var{color:var(--hl-var)}.hl-meta{color:var(--hl-meta)}
.hl-ins{background:var(--hl-ins);display:inline-block;min-width:100%}.hl-del{background:var(--hl-del);display:inline-block;min-width:100%}
@media (max-width:700px){body.split main{flex-direction:column}body.split #view{border-left:0;border-top:1px solid var(--line)}}
@media print{header,footer,#tabbar,#banner,#find,.src{display:none!important}#view{display:block!important;border:0;padding:0;overflow:visible}body,main{display:block}html{zoom:1!important}}
</style>
</head>

<script type="text/markdown" id="welcome"># Bienvenue dans MD Lite

Un éditeur **Markdown** très léger : texte brut à gauche, *aperçu* à droite.
Change de vue avec les boutons **Texte / Les deux / Aperçu** (Alt+1, 2, 3).
Les fichiers s'ouvrent en mode Aperçu ; tout se règle dans les **paramètres** (⚙ ou Ctrl+,).

## Ce qui est pris en charge

- **gras**, *italique*, ~~barré~~, ==surligné==, `code`, <kbd>Ctrl</kbd>+<kbd>S</kbd>
- [liens](https://commonmark.org), images (y compris `![](images/photo.png)` à côté du fichier)
- notes de bas de page[^1]
- listes à puces, numérotées et imbriquées
  1. premier
  2. second
- [x] listes de tâches (clique sur les cases dans l'aperçu)
- [ ] encore à faire

> Les citations aussi,
> sur plusieurs lignes.

<details>
<summary>Le HTML courant des README fonctionne aussi</summary>

Contenu replié, `<p align="center">`, `<img width="200">`, etc.

</details>

## Coloration du code

```rust
fn main() {
    let nom = "MD Lite"; // commentaire
    println!("Bonjour {nom} : {}", 42);
}
```

```python
def carre(x: int) -> int:
    """Retourne le carré."""
    return x ** 2
```

Langages : JavaScript, TypeScript, JSON, Python, Rust, C, C++, C#, Java, Kotlin, Go, PHP, Bash, PowerShell, SQL, HTML/XML, CSS, YAML, TOML/INI, diff.

## Raccourcis

| Raccourci | Action |
| :-- | :-- |
| Ctrl+B / I / K / E | Gras / italique / lien / code |
| Ctrl+F / Ctrl+H | Rechercher / remplacer |
| Ctrl+S / Ctrl+O | Enregistrer / ouvrir |
| Ctrl+T / Ctrl+W | Nouvel onglet / fermer l'onglet |
| Ctrl+Tab, Ctrl+1…9 | Changer d'onglet |
| Ctrl+N | Nouvelle fenêtre |
| Ctrl+, | Paramètres |
| Ctrl+molette, Ctrl+0 | Zoom |
| Ctrl+P | Imprimer ou exporter en PDF |
| Tab / Maj+Tab | Indenter / désindenter |
| Entrée | Continue la liste en cours |

---

Sélectionne du texte puis clique sur un bouton de la barre pour le mettre en forme. Clique à nouveau pour enlever la mise en forme.
Un lien vers un autre fichier `.md` l'ouvre dans un nouvel onglet ; un clic du milieu ferme un onglet.

[^1]: Comme celle-ci. Clique sur ↩ pour revenir au texte.

<script>
"use strict";
const $=id=>document.getElementById(id);
const out=$('out'),view=$('view'),mainEl=$('main');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// Dans md-lite.exe, la page est servie par le programme ; sinon c'est le fichier HTML ouvert seul dans un navigateur.
const NATIVE=location.host==='mdlite.localhost';

/* ---------- Paramètres ---------- */
const DEFAULTS={openMode:'read',newMode:'split',openIn:'tab',restoreSession:true,theme:'system',editorSize:14,previewSize:16,readWidth:820,
  wrap:true,spell:false,indent:4,eol:'lf',highlight:true,syncScroll:true,askDefault:true,zoom:1,lastMode:'split',welcomed:false};
let S={...DEFAULTS};
async function loadSettings(){
  let raw='';
  if(NATIVE){try{raw=await (await fetch('/api/store?key=settings')).text()}catch(e){}}
  else raw=store.get('mdlite-settings')||'';
  try{Object.assign(S,JSON.parse(raw))}catch(e){}
}
let saveTimer=0;
function saveSettings(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const j=JSON.stringify(S);
    if(NATIVE)fetch('/api/store?key=settings',{method:'PUT',body:j});else store.set('mdlite-settings',j);
  },200);
}
function applySettings(){
  const r=document.documentElement;
  if(S.theme==='system')delete r.dataset.theme;else r.dataset.theme=S.theme;
  r.style.setProperty('--ed-size',S.editorSize+'px');
  r.style.setProperty('--pv-size',S.previewSize+'px');
  r.style.setProperty('--read-width',+S.readWidth?S.readWidth+'px':'none');
  for(const t of tabs){t.ta.spellcheck=S.spell;t.ta.wrap=S.wrap?'soft':'off'}
  r.style.zoom=S.zoom;
  $('zoom').textContent=Math.round(S.zoom*100)+' %';
  if(T)render();
}
function setSetting(k,v){
  S[k]=v;applySettings();saveSettings();
  if(k==='theme'&&NATIVE)fetch('/api/theme?value='+v,{method:'POST'});
}

/* ---------- Coloration du code ---------- */
const span=(c,t)=>'<span class="hl-'+c+'">'+esc(t)+'</span>';
const P={

        if(k==='id'||k==='name'&&t==='a')n.setAttribute(k,'u-'+v);
      }
      if(t==='input'&&n.type!=='checkbox')n.remove();
    }
  };
  walk(doc.body);
  return doc.body;
}

/* ---------- Onglets ---------- */
const tabs=[];
let T=null,ta=null,raf=0,seq=0;

function untitledName(){
  let n=1;const nm=n=>n===1?'sans-titre.md':'sans-titre '+n+'.md';
  while(tabs.some(t=>t.name===nm(n)))n++;
  return nm(n);
}
function newTab({name,fpath='',text='',mode,handle=null}={}){
  const t={id:Date.now().toString(36)+(seq++),name:name||untitledName(),fpath,handle,dirty:false,mode:mode||S.newMode,vtop:0};
  t.ta=document.createElement('textarea');
  t.ta.className='src';t.ta.hidden=true;t.ta.setAttribute('aria-label','Texte Markdown');
  t.ta.spellcheck=S.spell;t.ta.wrap=S.wrap?'soft':'off';t.ta.value=text;
  hookTextarea(t.ta);
  mainEl.insertBefore(t.ta,view);
  t.el=document.createElement('div');
  t.el.className='tab';t.el.setAttribute('role','tab');t.el.draggable=true;
  t.el.innerHTML='<span class="tname"></span><button class="tclose" title="Fermer (Ctrl+W)"><span>×</span></button>';
  t.el.tab=t;
  $('tabs').append(t.el);
  tabs.push(t);
  label(t);activate(t);
  return t;
}
function label(t){
  t.el.querySelector('.tname').textContent=t.name;
  t.el.title=t.fpath||t.name;
  t.el.classList.toggle('dirty',t.dirty);
  if(t===T)updateTitle();
}
function updateTitle(){
  document.title=(T.dirty?'● ':'')+T.name+' — MD Lite';
  $('path').textContent=T.fpath;
}
function activate(t){
  if(T&&T!==t){T.vtop=view.scrollTop;T.ta.hidden=true;T.el.classList.remove('on')}
  T=t;ta=t.ta;ta.hidden=false;
  t.el.classList.add('on');t.el.scrollIntoView({block:'nearest',inline:'nearest'});
  setMode(t.mode,false);
  render();view.scrollTop=t.vtop;
  updateTitle();
  if(t.mode!=='read')ta.focus();

}
async function askSave(t){
  if(NATIVE)return (await fetch('/api/confirmclose?name='+encodeURIComponent(t.name),{method:'POST'})).text();
  return confirm('Les modifications de « '+t.name+' » seront perdues. Fermer quand même ?')?'no':'cancel';
}
// Propose d'enregistrer un onglet modifié ; renvoie false si l'utilisateur annule.
async function settle(t){
  if(!t.dirty)return true;
  activate(t);
  const c=await askSave(t);
  if(c==='cancel')return false;
  if(c==='yes'){await save(false,t);return !t.dirty}
  return true;
}
async function closeTab(t){
  if(!await settle(t))return;
  if(NATIVE)fetch('/api/closedoc?doc='+t.id,{method:'POST'});
  const i=tabs.indexOf(t);
  tabs.splice(i,1);t.ta.remove();t.el.remove();
  if(T===t){T=null;if(tabs.length)activate(tabs[Math.min(i,tabs.length-1)])}
  if(!tabs.length)newTab();
}
function cycleTab(d){if(tabs.length>1)activate(tabs[(tabs.indexOf(T)+d+tabs.length)%tabs.length])}

$('tabs').addEventListener('click',e=>{

$('tabs').addEventListener('auxclick',e=>{const el=e.target.closest('.tab');if(el&&e.button===1){e.preventDefault();closeTab(el.tab)}});

// Réorganiser les onglets par glisser-déposer.
let dragTab=null;
$('tabs').addEventListener('dragstart',e=>{const el=e.target.closest('.tab');if(!el)return;dragTab=el.tab;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/x-mdlite-tab',dragTab.id)});

/* ---------- Édition ---------- */
function render(){
  out.replaceChildren(...sanitize(md(ta.value)).childNodes);
  const v=ta.value;
  $('stats').textContent=(v.match(/\S+/g)||[]).length+' mots · '+v.length+' caractères · '+v.split('\n').length+' lignes';
}
function setDirty(t,d){t.dirty=d;label(t)}
function changed(){
  if(!T.dirty)setDirty(T,true);
  cancelAnimationFrame(raf);raf=requestAnimationFrame(render);
}
function loadInto(t,text,name,path){
  t.ta.value=text.replace(/\r\n?/g,'\n');t.name=name||t.name;t.fpath=path||'';
  setDirty(t,false);
  if(t===T){render();ta.setSelectionRange(0,0);ta.scrollTop=0;view.scrollTop=0}
}

// Remplace [s,e) par t puis sélectionne [s+a, s+b). execCommand garde l'historique Ctrl+Z.
function edit(s,e,t,a,b){
  ta.focus();ta.setSelectionRange(s,e);
  const ok=t?document.execCommand('insertText',false,t):document.execCommand('delete');
  if(!ok||ta.value.slice(s,s+t.length)!==t){ta.setRangeText(t,s,e,'end');changed()}
  ta.setSelectionRange(s+a,s+b);
}

function wrap(b,a,ph){
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  if(v.slice(s-b.length,s)===b&&v.slice(e,e+a.length)===a){edit(s-b.length,e+a.length,sel,0,sel.length);return}
  if(sel.length>=b.length+a.length&&sel.startsWith(b)&&sel.endsWith(a)){const t=sel.slice(b.length,sel.length-a.length);edit(s,e,t,0,t.length);return}
  const t=sel||ph;edit(s,e,b+t+a,b.length,b.length+t.length);
}

function mapLines(fn){
  const v=ta.value,s0=ta.selectionStart,e0=ta.selectionEnd;
  const s=s0?v.lastIndexOf('\n',s0-1)+1:0;
  let e=v.indexOf('\n',e0>s0&&v[e0-1]==='\n'?e0-1:e0);if(e<0)e=v.length;
  const r=fn(v.slice(s,e).split('\n')).join('\n');
  edit(s,e,r,s0===e0?r.length:0,r.length);
}

function setHeading(n){
  mapLines(ls=>ls.map(l=>{
    const cur=(l.match(/^#{1,6}(?= )/)||[''])[0].length,rest=l.replace(/^#{1,6} +/,'');
    return n===0||cur===n?rest:'#'.repeat(n)+' '+rest}));
}

const MK=/^\s*(?:[-*+] \[[ xX]\] |[-*+] |\d+[.)] )/;
function kindOf(l){const m=l.match(/^\s*(?:([-*+]) \[[ xX]\] |([-*+]) |(\d+)[.)] )/);return !m?null:m[1]?'task':m[2]?'ul':'ol'}
function list(kind){
  mapLines(ls=>{
    const filled=ls.filter(l=>l.trim()),off=filled.length&&filled.every(l=>kindOf(l)===kind);let n=0;
    return ls.map(l=>{
      if(!l.trim()&&ls.length>1)return l;
      const ind=l.match(/^\s*/)[0],rest=l.replace(MK,'').replace(/^\s*/,'');
      if(off)return ind+rest;
      n++;return ind+(kind==='ul'?'- ':kind==='ol'?n+'. ':'- [ ] ')+rest})});
}

function quote(){
  mapLines(ls=>{
    const filled=ls.filter(l=>l.trim()),off=filled.length&&filled.every(l=>/^\s*>/.test(l));
    return ls.map(l=>off?l.replace(/^(\s*)> ?/,'$1'):(l.trim()?'> '+l:'>'))});
}

// Insère un bloc entouré de lignes vides.
function insertBlock(s,e,body,a,b){
  const v=ta.value;
  const pre=s===0||v.slice(s-2,s)==='\n\n'||(s===1&&v[0]==='\n')?'':v[s-1]==='\n'?'\n':'\n\n';
  const post=e>=v.length?'\n':v[e]==='\n'?'\n':'\n\n';
  edit(s,e,pre+body+post,pre.length+a,pre.length+b);
}

function link(img){
  const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e).trim(),isUrl=/^(https?:\/\/|www\.)\S+$/.test(sel);
  const pre=(img?'!':'')+'[',txt=isUrl?'':sel||(img?'description':'texte du lien'),url=isUrl?sel:'https://',t=pre+txt+']('+url+')';
  if(isUrl)edit(s,e,t,pre.length,pre.length);
  else edit(s,e,t,pre.length+txt.length+2,pre.length+txt.length+2+url.length);
}

function insertTable(c,n){
  const row=f=>'| '+Array.from({length:c},(_,k)=>f(k)).join(' | ')+' |';
  const body=[row(k=>'Titre '+(k+1)),row(()=>'---'),...Array.from({length:n},()=>row(()=>'     '))].join('\n');
  const e=ta.selectionEnd;insertBlock(e,e,body,2,9);
}

function codeBlock(){
  const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e)||'code';
  insertBlock(s,e,'```\n'+sel+'\n```',4,4+sel.length);
}

// Appel de note au curseur + définition en fin de document, prête à être écrite.
function footnote(){
  const used=new Set([...ta.value.matchAll(/\[\^(\d+)\]/g)].map(m=>+m[1]));
  let n=1;while(used.has(n))n++;
  const e=ta.selectionEnd,ref='[^'+n+']';
  edit(e,e,ref,ref.length,ref.length);
  const v=ta.value,def='[^'+n+']: ',txt='texte de la note';
  const pre=v.endsWith('\n\n')?'':v.endsWith('\n')?'\n':'\n\n';
  edit(v.length,v.length,pre+def+txt+'\n',pre.length+def.length,pre.length+def.length+txt.length);
}

// Coche/décoche la n-ième case de l'aperçu directement dans le texte.
function toggleTask(idx,on){
  const re=/^((?:[ \t]*>)*[ \t]*(?:[-*+]|\d{1,9}[.)])[ \t]+\[)[ xX](?=\])/;
  let pos=0,n=0,fence=null;
  for(const line of ta.value.split('\n')){
    if(fence){if(isFenceEnd(line,fence))fence=null}
    else{
      const f=line.match(RE.fence);
      if(f)fence=f[1];
      else{const m=line.match(re);if(m){if(n===idx){const at=pos+m[1].length;ta.setRangeText(on?'x':' ',at,at+1,'preserve');changed();return}n++}}
    }
    pos+=line.length+1;
  }
}

const isMdPath=p=>/\.(md|markdown|mdown|mkd|mkdn|txt|text)$/i.test(p.split(/[?#]/)[0]);
out.addEventListener('click',async e=>{

  if(/^[a-z][a-z0-9+.-]*:/i.test(h)&&!/^[a-zA-Z]:[\\/]/.test(h)||h.startsWith('//')||!NATIVE){window.open(h,'_blank','noopener');return}
  // Lien local : un .md s'ouvre dans un onglet, le reste avec son application.

/* ---------- Fichiers ---------- */
async function docApi(path,opt,t=T){
  const r=await fetch(path+(path.includes('?')?'&':'?')+'doc='+t.id,opt);
  if(r.status>=400&&r.status!==409)throw new Error((await r.text())||('erreur '+r.status));
  return r;
}
async function loadResp(t,r){
  loadInto(t,await r.text(),decodeURIComponent(r.headers.get('X-Name')||''),decodeURIComponent(r.headers.get('X-Path')||''));
}
const openMode=()=>S.openMode==='last'?S.lastMode:S.openMode;

// Ouvre un fichier dans un onglet (ou bascule sur l'onglet qui l'affiche déjà).
async function openPath(p,quiet){
  const same=tabs.find(t=>t.fpath&&t.fpath.toLowerCase()===p.toLowerCase());
  if(same){activate(same);return}
  if(!isMdPath(p)&&!quiet&&!confirm('Ouvrir « '+p.split(/[\\/]/).pop()+' » comme texte ?'))return;
  const reuse=T&&!T.fpath&&!T.dirty&&!T.ta.value.trim()?T:null;
  const t=reuse||newTab({mode:openMode()});
  try{
    await loadResp(t,await docApi('/api/open?path='+encodeURIComponent(p),{method:'POST'},t));
    t.mode=openMode();
    if(t===T)activate(t);
  }catch(e){
    if(!quiet)alert('Ouverture impossible : '+e.message);
    if(!reuse)closeTab(t);
  }
}

function download(t=T){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t.ta.value],{type:'text/markdown'}));
  a.download=t.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function save(as,t=T){
  try{
    if(NATIVE){
      let r=as?null:await docApi('/api/file',{method:'PUT',body:t.ta.value},t);
      if(as||r.status===409){
        r=await docApi('/api/saveas?name='+encodeURIComponent(t.name)+'&crlf='+(S.eol==='crlf'?1:0),{method:'POST',body:t.ta.value},t);
        if(r.status!==200)return;
        t.name=decodeURIComponent(r.headers.get('X-Name'));t.fpath=decodeURIComponent(r.headers.get('X-Path')||'');
      }
      setDirty(t,false);return;
    }
    if(window.showSaveFilePicker){
      if(!t.handle||as)t.handle=await showSaveFilePicker({suggestedName:t.name,types:[{description:'Markdown',accept:{'text/markdown':['.md']}}]});
      const w=await t.handle.createWritable();await w.write(t.ta.value);await w.close();
      t.name=t.handle.name;setDirty(t,false);return;
    }
    download(t);setDirty(t,false);
  }catch(e){
    if(e.name==='AbortError')return;
    if(NATIVE){alert('Enregistrement impossible : '+e.message);if(!as)return save(true,t);return}
    if(confirm('Enregistrement impossible : '+e.message+'\n\nTélécharger une copie du fichier ?'))download(t);
  }
}

/* ---------- Rechercher / remplacer ---------- */
const findBar=$('find'),q=$('q'),rep=$('rep');
function openFind(replace){
  findBar.hidden=false;
  const sel=ta.value.slice(ta.selectionStart,ta.selectionEnd);
  if(sel&&!sel.includes('\n'))q.value=sel;
  if(replace&&document.body.className!=='read')rep.focus();else{q.focus();q.select()}
  countFind();
}
function closeFind(){findBar.hidden=true;if(document.body.className!=='read')ta.focus()}
function countFind(){
  const s=q.value.toLowerCase(),n=s?ta.value.toLowerCase().split(s).length-1:0;
  $('fcount').textContent=s?(n?n+' résultat'+(n>1?'s':''):'aucun résultat'):'';
}
function findNext(back){
  const s=q.value;if(!s)return;
  if(document.body.className==='read'){window.find(s,false,back,true);return}
  const v=ta.value.toLowerCase(),t=s.toLowerCase();
  let i=back?(ta.selectionStart?v.lastIndexOf(t,ta.selectionStart-1):-1):v.indexOf(t,ta.selectionEnd);
  if(i<0)i=back?v.lastIndexOf(t):v.indexOf(t);
  if(i<0)return;
  const f=document.activeElement;
  ta.focus();ta.setSelectionRange(i,i+s.length);
  if(f&&f!==ta&&f.focus)f.focus();
}
function replaceOne(){
  const s=q.value;if(!s)return;
  const f=document.activeElement,cur=ta.value.slice(ta.selectionStart,ta.selectionEnd);
  if(cur.toLowerCase()===s.toLowerCase())edit(ta.selectionStart,ta.selectionEnd,rep.value,rep.value.length,rep.value.length);
  if(f&&f.focus)f.focus();
  findNext(false);countFind();
}
function replaceAll(){
  const s=q.value;if(!s)return;
  const re=new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),nv=ta.value.replace(re,()=>rep.value);
  if(nv!==ta.value){const f=document.activeElement;edit(0,ta.value.length,nv,0,0);if(f&&f.focus)f.focus()}
  countFind();
}
q.addEventListener('input',countFind);
findBar.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();closeFind()}
  else if(e.key==='Enter'){e.preventDefault();if(e.target===rep&&!e.shiftKey)replaceOne();else findNext(e.shiftKey)}
});
findBar.addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(!b)return;
  ({prev:()=>findNext(true),next:()=>findNext(false),one:replaceOne,all:replaceAll,close:closeFind})[b.dataset.f]();
});

  const c=+e.target.dataset.c,r=+e.target.dataset.r;if(!c)return;
  for(const i of tg.children)i.classList.toggle('on',+i.dataset.c<=c&&+i.dataset.r<=r);
  $('tlabel').textContent=c+' colonne'+(c>1?'s':'')+' × '+r+' ligne'+(r>1?'s':'');
});
tg.addEventListener('click',e=>{const c=+e.target.dataset.c,r=+e.target.dataset.r;if(!c)return;tp.hidden=true;insertTable(c,r)});
document.addEventListener('mousedown',e=>{if(!tp.hidden&&!tp.contains(e.target)&&!e.target.closest('[data-a=table]'))tp.hidden=true});

/* ---------- Paramètres (fenêtre) ---------- */
const dlg=$('settings');
async function openSettings(){
  for(const el of dlg.querySelectorAll('[data-set]')){
    const v=S[el.dataset.set];
    if(el.type==='checkbox')el.checked=!!v;else el.value=String(v);
  }
  dlg.querySelectorAll('.nat').forEach(e=>e.hidden=!NATIVE);
  if(NATIVE)refreshDefault();
  dlg.showModal();
}
async function refreshDefault(){
  try{
    const d=await (await fetch('/api/default')).text()==='1';
    $('defstate').textContent=d?'MD Lite est l\'application par défaut pour les .md.':'MD Lite n\'est pas l\'application par défaut.';
    $('setdef').hidden=d;
    return d;
  }catch(e){return true}
}
dlg.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.set;if(!k)return;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(typeof DEFAULTS[k]==='number'){v=+v;if(el.min&&v<+el.min)v=+el.min;if(el.max&&v>+el.max)v=+el.max}
  setSetting(k,v);
});
$('sclose').addEventListener('click',()=>dlg.close());
$('sreset').addEventListener('click',()=>{
  if(!confirm('Remettre tous les paramètres par défaut ?'))return;
  const keep={welcomed:S.welcomed,lastMode:S.lastMode},theme=S.theme;
  S={...DEFAULTS,...keep};applySettings();saveSettings();
  if(NATIVE&&theme!==S.theme)fetch('/api/theme?value='+S.theme,{method:'POST'});
  openSettings();
});
$('guide').addEventListener('click',()=>{dlg.close();showGuide()});
$('setdef').addEventListener('click',makeDefault);
function showGuide(){newTab({name:'guide.md',text:$('welcome').textContent.trim()+'\n',mode:'split'})}

async function makeDefault(){
  try{
    if(await (await fetch('/api/makedefault',{method:'POST'})).text()==='1')$('banner').hidden=true;
    if(dlg.open)refreshDefault();
  }catch(e){alert('Impossible : '+e.message)}
}
async function checkDefault(){
  if(!NATIVE||!S.askDefault)return;
  try{if(await (await fetch('/api/default')).text()==='0')$('banner').hidden=false}catch(e){}
}
$('bdef').addEventListener('click',makeDefault);
$('blater').addEventListener('click',()=>$('banner').hidden=true);
$('bnever').addEventListener('click',()=>{setSetting('askDefault',false);$('banner').hidden=true});

/* ---------- Clavier, barre d'outils, vues ---------- */
function onTextKey(ev){
  if(ev.key==='Enter'&&!ev.shiftKey&&!ev.ctrlKey&&!ev.altKey&&!ev.isComposing&&ta.selectionStart===ta.selectionEnd){
    const v=ta.value,c=ta.selectionStart,ls=c?v.lastIndexOf('\n',c-1)+1:0,line=v.slice(ls,c);
    const m=line.match(/^(\s*)([-*+] \[[ xX]\] |[-*+] |(\d+)([.)]) |> )/);
    if(!m)return;
    ev.preventDefault();
    if(line.trim()===m[2].trim()){edit(ls,c,'',0,0);return}
    const next=m[3]?(+m[3]+1)+m[4]+' ':m[2].replace(/\[[xX]\]/,'[ ]'),t='\n'+m[1]+next;
    edit(c,c,t,t.length,t.length);
  }else if(ev.key==='Tab'&&!ev.ctrlKey&&!ev.altKey){
    ev.preventDefault();
    const n=+S.indent,pad=' '.repeat(n),out=new RegExp('^ {1,'+n+'}');
    const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,ls=s?v.lastIndexOf('\n',s-1)+1:0,le=v.indexOf('\n',ls);
    const onList=MK.test(v.slice(ls,le<0?v.length:le));
    if(!ev.shiftKey&&s===e&&!onList)edit(s,s,pad,n,n);
    else mapLines(ls=>ls.map(l=>ev.shiftKey?l.replace(out,''):pad+l));
  }
}
function hookTextarea(el){
  el.addEventListener('input',changed);
  el.addEventListener('keydown',onTextKey);
  el.addEventListener('scroll',()=>sync(el,view));
}

document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!tp.hidden){tp.hidden=true;return}
  if(dlg.open)return;
  if(ev.altKey&&!ev.ctrlKey&&['1','2','3'].includes(ev.key)){ev.preventDefault();setMode(['edit','split','read'][ev.key-1]);return}
  if(!(ev.ctrlKey||ev.metaKey)||ev.altKey)return;
  const k=ev.key.toLowerCase();
  if(k==='tab'||k==='pagedown'||k==='pageup'){ev.preventDefault();cycleTab(k==='pageup'||ev.shiftKey&&k==='tab'?-1:1);return}
  if(/^[1-9]$/.test(k)){ev.preventDefault();const t=k==='9'?tabs[tabs.length-1]:tabs[+k-1];if(t)activate(t);return}
  if(k==='='||k==='+'){ev.preventDefault();setSetting('zoom',Math.min(3,Math.round((S.zoom+.1)*10)/10));return}
  if(k==='-'){ev.preventDefault();setSetting('zoom',Math.max(.5,Math.round((S.zoom-.1)*10)/10));return}
  if(k==='0'){ev.preventDefault();setSetting('zoom',1);return}
  if(k==='f'||k==='h'){ev.preventDefault();openFind(k==='h');return}
  const global=ev.shiftKey?{s:'saveAs'}:{s:'save',o:'openFile',n:'newWindow',t:'newTab',w:'closeTab',p:'print',',':'settings'};
  const fmt=ev.shiftKey?{x:'strike'}:{b:'bold',i:'italic',k:'link',e:'code'};
  if(global[k]){ev.preventDefault();A[global[k]]()}
  else if(fmt[k]&&document.activeElement===ta){ev.preventDefault();A[fmt[k]]()}
});

document.querySelector('header').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.a)A[b.dataset.a](b);
  if(b.dataset.mode)setMode(b.dataset.mode);
});
$('heading').addEventListener('change',e=>{if(e.target.value!=='')setHeading(+e.target.value);e.target.value=''});

function setMode(m,user=true){
  document.body.className=m;
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  if(T)T.mode=m;
  if(user){S.lastMode=m;saveSettings();if(m!=='read')ta.focus()}
}

addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setSetting('zoom',Math.min(3,Math.max(.5,Math.round((S.zoom+(e.deltaY<0?.1:-.1))*10)/10)))}},{passive:false});
$('zoom').addEventListener('click',()=>setSetting('zoom',1));

// Défilement synchronisé en vue partagée.
let leader=null,leadTimer=0;
function sync(a,b){
  if(!S.syncScroll||document.body.className!=='split'||(leader&&leader!==a))return;
  leader=a;clearTimeout(leadTimer);leadTimer=setTimeout(()=>leader=null,120);
  b.scrollTop=a.scrollTop/((a.scrollHeight-a.clientHeight)||1)*(b.scrollHeight-b.clientHeight);
}
view.addEventListener('scroll',()=>sync(view,ta));

/* ---------- Démarrage ---------- */
(async()=>{
  await loadSettings();
  applySettings();
  const first=!S.welcomed;
  if(first){S.welcomed=true;saveSettings()}
  if(NATIVE){
    try{
      const st=await (await fetch('/api/startup')).json();
      let files=st.files,active=-1,quiet=false;
      if(!files.length&&!st.fresh&&S.restoreSession){
        try{const s=JSON.parse(await (await fetch('/api/store?key=session')).text());files=s.files||[];active=s.active;quiet=true}catch(e){}
      }
      for(const f of files)await openPath(f,quiet);
      if(active>=0&&tabs[active])activate(tabs[active]);
    }catch(e){alert('Démarrage : '+e.message)}
    checkDefault();
  }
  if(first)showGuide();
  if(!tabs.length)newTab();
})();
</script>
