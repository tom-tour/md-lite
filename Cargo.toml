[package]
name = "md-lite"
version = "2.0.0"
edition = "2021"
description = "Lecteur et éditeur Markdown léger pour Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/tom-tour/md-lite"

[dependencies]
wry = "0.57"
tao = "0.37"
rfd = { version = "0.17", features = ["common-controls-v6"] }
winreg = "0.56"
raw-window-handle = "0.6"
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
