[package]
name = "md-lite"
version = "2.1.1"
edition = "2021"
description = "Lecteur et éditeur Markdown léger pour Windows et Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/tom-tour/md-lite"

[dependencies]
wry = { version = "0.57", features = ["linux-body"] }
tao = "0.37"
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
raw-window-handle = "0.6"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
